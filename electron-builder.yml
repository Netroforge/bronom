appId: com.netroforge.bronom
productName: Bronom
copyright: Copyright © 2026 Netroforge

directories:
  buildResources: build

files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
  - node_modules/**

asar: true
npmRebuild: false

win:
  executableName: Bronom
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: bronom-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

portable:
  artifactName: bronom-${version}-${arch}-windows-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  hardenedRuntime: false
  notarize: false
  extendInfo:
    NSCameraUsageDescription: Bronom lets websites use the camera after user approval.
    NSMicrophoneUsageDescription: Bronom lets websites use the microphone after user approval.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: bronom-${version}-${arch}.${ext}

linux:
  icon: build/icons
  syncDesktopName: true
  category: Network
  maintainer: Netroforge
  executableName: bronom
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64

appImage:
  artifactName: bronom-${version}-${arch}.${ext}

deb:
  artifactName: bronom-${version}-${arch}.${ext}

rpm:
  artifactName: bronom-${version}-${arch}.${ext}

publish:
  provider: github
  owner: Netroforge
  repo: bronom
